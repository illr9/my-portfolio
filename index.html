<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>معرض الأعمال | أنس عبدالرحيم ميرقاسم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      margin: 0;
      background: #f7f7f9;
      color: #222;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .top-bar {
      background: #1f2937;
      color: #fff;
      padding: 30px 0;
      text-align: center;
    }
    .top-bar h1 { margin: 0 0 8px; }
    .section h2 { margin: 30px 0 20px; }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    .project-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      transition: transform .2s;
    }
    .project-card:hover { transform: translateY(-4px); }
    .project-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .project-card .info { padding: 14px; }
    .project-card .info h3 { margin: 0 0 6px; font-size: 1.05rem; }
    .project-card .info p { margin: 0; font-size: .9rem; color: #555; }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="container">
      <h1>معرض الأعمال</h1>
      <p>أنس عبدالرحيم ميرقاسم</p>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2>أبرز الأعمال</h2>

      <div class="projects">
        <!-- مثال 1: صورة داخل مجلد images -->
        <div class="project-card">
          <img src="images/project1.jpg" alt="مشروع 1" />
          <div class="info">
            <h3>تصميم موقع</h3>
            <p>واجهة ويب متجاوبة.</p>
          </div>
        </div>

        <!-- مثال 2: صورة من الإنترنت -->
        <div class="project-card">
          <img src="https://picsum.photos/seed/p2/600/400" alt="مشروع 2" />
          <div class="info">
            <h3>تطبيق جوال</h3>
            <p>واجهة استخدام حديثة.</p>
          </div>
        </div>

        <!-- مثال 3: صورة بجانب الملف نفسه -->
        <div class="project-card">
          <img src="project3.png" alt="مشروع 3" />
          <div class="info">
            <h3>هوية بصرية</h3>
            <p>شعار وألوان.</p>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
